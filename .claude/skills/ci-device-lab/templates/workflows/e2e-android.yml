# Runs Maestro flows on a hosted Android emulator against the APK from an android-apk run.
name: e2e-android
on:
  workflow_dispatch:
    inputs:
      build_run_id: { description: "Run id of an android-apk run (debug variant)", required: true }
      flows: { description: "Flow file or folder under maestro/flows", default: "maestro/flows" }
      api_level: { default: "34" }
permissions: { contents: read, actions: read }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "android-apk-${{ inputs.build_run_id }}", run-id: "${{ inputs.build_run_id }}", github-token: "${{ github.token }}", path: apk }
      - name: Decrypt APK if needed
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: if [ -f apk/app.apk.enc ]; then node scripts/decrypt-artifact.mjs apk/app.apk.enc apk/app.apk; fi
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          FLOWS: ${{ inputs.flows }}
          APP_ID: ${{ vars.APP_ID }}
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: adb install -r apk/app.apk && bash maestro/run.sh android
      - name: Results (flow names only)
        if: always()
        run: cat "$RUNNER_TEMP/maestro/summary.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Encrypt evidence (screenshots, logs)
        if: always()
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: |
          [ -d "$RUNNER_TEMP/maestro" ] || exit 0
          tar -czf "$RUNNER_TEMP/evidence.tgz" -C "$RUNNER_TEMP" maestro
          if [ "${{ github.event.repository.visibility }}" = public ]; then
            node scripts/encrypt-artifact.mjs "$RUNNER_TEMP/evidence.tgz" "$RUNNER_TEMP/evidence.tgz.enc" && rm "$RUNNER_TEMP/evidence.tgz"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "e2e-android-${{ github.run_id }}", path: "${{ runner.temp }}/evidence.tgz*", retention-days: 7, if-no-files-found: ignore }
