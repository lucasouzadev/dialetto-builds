# Builds the simulator app and runs Maestro flows on a hosted iOS simulator. No Mac or iPhone needed.
name: e2e-ios
on:
  workflow_dispatch:
    inputs:
      ref: { description: "App branch, tag or sha", default: main }
      framework: { type: choice, options: [expo, react-native, capacitor, native], default: expo }
      app_dir: { default: "." }
      flows: { default: "maestro/flows" }
      device: { description: "Simulator name contains", default: "iPhone" }
permissions: { contents: read }
jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: ci }
      - name: Checkout private app source (read-only)
        if: ${{ vars.SOURCE_REPO != '' }}
        env: { DEPLOY_KEY: "${{ secrets.SOURCE_DEPLOY_KEY }}", REPO: "${{ vars.SOURCE_REPO }}", REF: "${{ inputs.ref }}", DEST: app }
        run: bash ci/scripts/checkout-private-source.sh
      - if: ${{ vars.SOURCE_REPO == '' }}
        run: ln -s ci app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: bash ci/scripts/install-deps.sh "app/${{ inputs.app_dir }}"
      - name: Native project + simulator build
        working-directory: app/${{ inputs.app_dir }}
        run: |
          case "${{ inputs.framework }}" in
            expo) npx expo prebuild --platform ios --no-install ;;
            capacitor) npm run build --if-present && npx cap sync ios ;;
          esac
          cd ios; [ -f Podfile ] && pod install
          ws=$(ls -d *.xcworkspace 2>/dev/null | head -1); proj=$(ls -d *.xcodeproj | head -1)
          target=(-project "$proj"); [ -n "$ws" ] && target=(-workspace "$ws")
          scheme=$(xcodebuild -list -json "${target[@]}" | python3 -c 'import json,sys;d=json.load(sys.stdin);print((d.get("workspace") or d.get("project"))["schemes"][0])')
          xcodebuild build "${target[@]}" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -n 30
          echo "APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)" >> "$GITHUB_ENV"
      - name: Boot simulator and install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,os;d=json.load(sys.stdin)['devices'];n=os.environ['DEV'];c=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if n in x['name']];print(c[-1])")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
        env: { DEV: "${{ inputs.device }}" }
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run flows
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          FLOWS: ${{ inputs.flows }}
          APP_ID: ${{ vars.APP_ID }}
        run: bash ci/maestro/run.sh ios
      - name: Results (flow names only)
        if: always()
        run: cat "$RUNNER_TEMP/maestro/summary.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Encrypt evidence
        if: always()
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: |
          [ -d "$RUNNER_TEMP/maestro" ] || exit 0
          tar -czf "$RUNNER_TEMP/evidence.tgz" -C "$RUNNER_TEMP" maestro
          if [ "${{ github.event.repository.visibility }}" = public ]; then
            node ci/scripts/encrypt-artifact.mjs "$RUNNER_TEMP/evidence.tgz" "$RUNNER_TEMP/evidence.tgz.enc" && rm "$RUNNER_TEMP/evidence.tgz"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "e2e-ios-${{ github.run_id }}", path: "${{ runner.temp }}/evidence.tgz*", retention-days: 7, if-no-files-found: ignore }
