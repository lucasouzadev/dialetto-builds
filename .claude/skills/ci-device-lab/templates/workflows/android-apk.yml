# Builds an installable Android APK on a hosted Linux runner. No device or Android Studio needed.
# Frameworks: expo (prebuild + Gradle, no EAS cloud), react-native, capacitor, native (Gradle project in android/).
name: android-apk
on:
  workflow_dispatch:
    inputs:
      ref: { description: "App branch, tag or sha", default: main }
      framework: { type: choice, options: [expo, react-native, capacitor, native], default: expo }
      app_dir: { description: "App folder inside the repo", default: "." }
      variant: { type: choice, options: [debug, release], default: debug }
permissions: { contents: read }
concurrency: { group: "android-apk-${{ inputs.ref }}", cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '100' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: ci }
      - name: Checkout private app source (read-only)
        if: ${{ vars.SOURCE_REPO != '' }}
        env: { DEPLOY_KEY: "${{ secrets.SOURCE_DEPLOY_KEY }}", REPO: "${{ vars.SOURCE_REPO }}", REF: "${{ inputs.ref }}", DEST: app }
        run: bash ci/scripts/checkout-private-source.sh
      - if: ${{ vars.SOURCE_REPO == '' }}
        run: ln -s ci app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install dependencies
        run: bash ci/scripts/install-deps.sh "app/${{ inputs.app_dir }}"
      - name: Generate the native Android project
        working-directory: app/${{ inputs.app_dir }}
        run: |
          case "${{ inputs.framework }}" in
            expo) npx expo prebuild --platform android --no-install ;;
            capacitor) npm run build --if-present && npx cap sync android ;;
            *) echo "using existing android/ project" ;;
          esac
      - name: Restore signing key (optional; keystore never printed)
        if: ${{ inputs.variant == 'release' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::no ANDROID_KEYSTORE_BASE64: release APK will be unsigned"; exit 0; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Gradle build
        working-directory: app/${{ inputs.app_dir }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          code=$((BUILD_NUMBER_OFFSET + BUILD_NUMBER))
          task=assemble$( [ "${{ inputs.variant }}" = release ] && echo Release || echo Debug )
          signing=()
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            signing=(-Pandroid.injected.signing.store.file="$KEYSTORE_PATH"
                     -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD"
                     -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS"
                     -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD")
          fi
          chmod +x gradlew
          ./gradlew --no-daemon "$task" -PversionCode="$code" "${signing[@]}"
          mkdir -p "$RUNNER_TEMP/out"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/out/app.apk" \; -quit
          sha256sum "$RUNNER_TEMP/out/app.apk" | tee "$RUNNER_TEMP/out/app.apk.sha256"
          echo "versionCode=$code" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt when this repository is public
        if: ${{ github.event.repository.visibility == 'public' }}
        env: { ARTIFACT_PASSPHRASE: "${{ secrets.ARTIFACT_PASSPHRASE }}" }
        run: |
          node ci/scripts/encrypt-artifact.mjs "$RUNNER_TEMP/out/app.apk" "$RUNNER_TEMP/out/app.apk.enc"
          rm "$RUNNER_TEMP/out/app.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "android-apk-${{ github.run_id }}", path: "${{ runner.temp }}/out/", retention-days: 7 }
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
