# Signs in with the E2E account. Expects the app to be on its sign-in screen
# and the variables EMAIL and PASSWORD (passed with `maestro test -e`).
# The field labels are the visible ones: "email" and "password".
appId: club.dialetto.app
---
- extendedWaitUntil:
    visible: "Sign in|Entrar"
    timeout: 60000
- runFlow: dismiss-consent.yaml
- tapOn: "email"
- inputText: ${EMAIL}
- tapOn: "password"
- inputText: ${PASSWORD}
# `hideKeyboard` fails on the iOS simulator ("Couldn't hide the keyboard"), so submit
# with the keyboard's return key and fall back to the button if the form did not go.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Workbench.*|Bancada.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "Workbench.*|Bancada.*"
    commands:
      - tapOn: "Sign in|Entrar"
- extendedWaitUntil:
    visible: "Workbench.*|Bancada.*"
    timeout: 60000
