# Lyrics v3 (sub-project 54): opens the FIRST track of whatever account the E2E secrets
# point to, opens its lyrics, writes 5 neutral lines when there are none, enters
# "Sincronizar tocando", marks the lines and reaches the review, then discards.
# Nothing is saved by the flow itself; if the app needs the lyric saved first, the run
# report says what was written. The simulator/emulator may not play audio.
appId: club.dialetto.app
name: Lyrics v3 - sync while playing
tags:
  - lyrics
  - login
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../lib/sign-in.yaml
- takeScreenshot: 30-library
- tapOn: "Tracks.*|Faixas.*"
- takeScreenshot: 31-tracks
# First track of the list (no title is assumed).
- tapOn:
    point: "50%,32%"
- takeScreenshot: 32-track-open
- tapOn: "Lyrics|Letra"
- takeScreenshot: 33-lyrics-open
- runFlow:
    when:
      visible: "Add lyrics|Adicionar letra"
    commands:
      - tapOn: "Add lyrics|Adicionar letra"
- takeScreenshot: 34-lyrics-editor
