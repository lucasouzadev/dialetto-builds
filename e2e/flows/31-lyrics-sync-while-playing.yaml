# Lyrics v3 (sub-project 54): opens a track's lyrics, enters "Sincronizar tocando",
# marks the lines and reaches the review, then DISCARDS so the account is unchanged.
# The simulator/emulator may not play audio: "Tocar e marcar" is tolerated either way.
# Needs the synthetic QA track "QA neutra 65s" (project "QA letra v3 neutro") on the
# E2E account; its 12 tagged lines expand to 17.
appId: club.dialetto.app
name: Lyrics v3 - sync while playing
tags:
  - lyrics
  - login
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../lib/sign-in.yaml
- tapOn: "Folders.*|Pastas.*"
- tapOn: "QA letra v3 neutro.*"
- tapOn: "QA neutra 65s.*"
- takeScreenshot: 31-track-open
- tapOn: "Lyrics|Letra"
- takeScreenshot: 31-lyrics-open
- tapOn: "Sync while playing|Sincronizar tocando"
- extendedWaitUntil:
    visible: "Play and mark|Tocar e marcar|Mark|Marcar"
    timeout: 15000
- takeScreenshot: 32-sync-start
- repeat:
    times: 17
    commands:
      - tapOn: "Play and mark|Tocar e marcar|Mark|Marcar"
- takeScreenshot: 33-sync-after-taps
- tapOn:
    text: "Pause|Pausar"
    optional: true
- takeScreenshot: 34-sync-review
# Reaches the review (17 expanded lines). Discard so the account is unchanged.
- tapOn:
    text: "Discard changes|Descartar alterações"
    optional: true
- takeScreenshot: 35-after-discard
