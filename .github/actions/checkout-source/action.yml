name: Checkout the private Dialetto source
description: >
  Clones lucasouzadev/dialetto (private) into ./src with a read-only deploy key,
  through scripts/checkout-private-source.sh (which repairs a damaged key and
  explains a wrong one). Call actions/checkout for THIS repository first: the
  script, the local actions and the e2e flows live here.

inputs:
  ssh-key:
    description: Private half of a read-only deploy key, or a fine-grained GitHub token restricted to Dialetto with Contents read-only (secret DIALETTO_DEPLOY_KEY). Token scopes must be configured in GitHub.
    required: true
  ref:
    description: Branch, tag or full commit sha of the private repository to build.
    required: false
    default: main

outputs:
  sha:
    description: Full commit sha that was checked out.
    value: ${{ steps.clone.outputs.sha }}
  short:
    description: First 7 characters of the commit sha.
    value: ${{ steps.clone.outputs.short }}

runs:
  using: composite
  steps:
    # Only the hash is ever printed: this repository is public, so its logs are
    # too, and a private commit message does not belong in them.
    - name: Clone the private source
      id: clone
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.ssh-key }}
        REF: ${{ inputs.ref }}
      run: bash "$GITHUB_WORKSPACE/scripts/checkout-private-source.sh"
