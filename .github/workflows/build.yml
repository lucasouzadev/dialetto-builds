name: Build (Android APK / iOS / TestFlight)

# Manual only: Actions -> "Build" -> Run workflow. Builds the Capacitor shells
# from the SAME web bundle that ships to the web, from the private source repo.
#
#   android-apk             Debug APK. Download it from the run's Artifacts, or
#                           tick "publish_release" to put it on a GitHub Release.
#   ios-check               Compiles for the iOS Simulator (unsigned). No Apple secrets.
#   android-and-ios-check   Both of the above.
#   ios-testflight          Signed archive uploaded to App Store Connect (TestFlight).
#                           Sends Apple's e-mails to you and your testers: run it
#                           on purpose, not to "see if it works".
#
# Nothing triggers this automatically.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: android-apk
        options:
          - android-apk
          - ios-check
          - android-and-ios-check
          - ios-testflight
      ref:
        description: Branch, tag or commit of lucasouzadev/dialetto to build
        type: string
        default: main
      publish_release:
        description: Android only -- publish the APK as a GitHub pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  android-apk:
    if: inputs.target == 'android-apk' || inputs.target == 'android-and-ios-check'
    uses: ./.github/workflows/_android-apk.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  release-apk:
    name: Publish the APK as a pre-release
    if: inputs.publish_release && (inputs.target == 'android-apk' || inputs.target == 'android-and-ios-check')
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dialetto-android-debug-apk
          path: apk

      # This repository is public, so everything here is world-readable: the
      # note carries the build number, the short source hash and the APK
      # checksum -- never a commit message from the private repository.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.android-apk.outputs.build_number }}
          SHORT: ${{ needs.android-apk.outputs.source_short }}
        run: |
          set -euo pipefail
          file="dialetto-android-b${BUILD}-${SHORT}.apk"
          mv apk/app-debug.apk "apk/${file}"
          sum="$(sha256sum "apk/${file}" | cut -d' ' -f1)"
          cat > notes.md <<NOTES
          Dialetto Android build **${BUILD}** (source \`${SHORT}\`).

          - sha256: \`${sum}\`
          - Debug build for testing. Install it by opening the file on the phone
            (allow "install unknown apps" for the app you open it from).
          - An installed app is only updated by a build signed with the same
            key and a higher build number.

          Not an official release.
          NOTES
          gh release create "android-b${BUILD}" "apk/${file}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Android build ${BUILD}" \
            --notes-file notes.md
          echo "Published: android-b${BUILD}" >> "$GITHUB_STEP_SUMMARY"

  ios-check:
    if: inputs.target == 'ios-check' || inputs.target == 'android-and-ios-check'
    uses: ./.github/workflows/_ios-simulator.yml
    with:
      ref: ${{ inputs.ref }}
      artifact_days: 1
    secrets: inherit

  ios-testflight:
    if: inputs.target == 'ios-testflight'
    runs-on: macos-26
    timeout-minutes: 60
    # Put the four Apple secrets on this Environment (Settings -> Environments)
    # and add yourself as a required reviewer: the build then stops until you
    # approve it, which is the guard against an accidental TestFlight upload.
    environment: ios-release
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VITE_SUPABASE_URL: https://ohcgrtaultutxmcpoicl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_y8X6t-Es_w8D5d4a6qy84g_fP5ClLKp
      VITE_WORKER_URL: https://dialetto-worker.fly.dev
    steps:
      - name: Check the signing secrets exist
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see README.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-source
        with:
          ssh-key: ${{ secrets.DIALETTO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}

      # App Store Connect rejects a repeated or lower build number. The run
      # number restarted at 1 in this repository, so it is offset past every
      # number already uploaded (repository variable BUILD_NUMBER_OFFSET).
      - name: Compute the build number
        env:
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '100' }}
        run: |
          if ! [[ "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error::BUILD_NUMBER_OFFSET must be a whole number (got '$OFFSET')."
            exit 1
          fi
          n=$(( OFFSET + GITHUB_RUN_NUMBER ))
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
          echo "Build number: $n"

      - name: Xcode version
        run: xcodebuild -version

      - uses: ./.github/actions/setup-web

      - name: Build the web bundle and sync it into ios/
        working-directory: src/frontend
        run: bun run cap:sync

      # Fixes the two usual copy/paste problems with a .p8 stored as a secret
      # (literal "\n" instead of line breaks, stray carriage returns), then
      # prints yes/no facts about the SHAPE of every value -- never a value.
      - name: Write and sanity-check the App Store Connect API key
        run: |
          key_file="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | tr -d '\r' | perl -pe 's/\\n/\n/g' > "$key_file"
          [ -n "$(tail -c1 "$key_file")" ] && echo >> "$key_file"
          chmod 600 "$key_file"
          shape() { if grep -Eq "$2" <<<"$1"; then echo yes; else echo NO; fi; }
          echo "Key ID is 10 letters/digits:         $(shape "$ASC_KEY_ID" '^[A-Z0-9]{10}$')"
          echo "Issuer ID is a UUID:                 $(shape "$ASC_ISSUER_ID" '^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$')"
          echo "Team ID is 10 letters/digits:        $(shape "$APPLE_TEAM_ID" '^[A-Z0-9]{10}$')"
          echo "Key starts with BEGIN PRIVATE KEY:   $(shape "$(head -1 "$key_file")" '^-----BEGIN PRIVATE KEY-----$')"
          echo "Key ends with END PRIVATE KEY:       $(shape "$(tail -1 "$key_file")" '^-----END PRIVATE KEY-----$')"
          echo "Key line count (expect 4-5):         $(wc -l < "$key_file" | tr -d ' ')"

      # Calls App Store Connect with the same key, so a rejected credential is
      # reported here in Apple's words instead of as an opaque Xcode 401.
      - name: Verify the API key and the app record with Apple
        working-directory: src
        run: node scripts/ci/verify-app-store-connect.mjs

      # Every run makes Xcode create a throwaway Apple Development certificate
      # on a fresh runner, until the account hits Apple's cap. Delete the
      # account's DEVELOPMENT certificates first; distribution ones are never
      # touched (allowlist in the script). Best effort: never fails the build.
      - name: Free the development-certificate slots
        working-directory: src
        run: node scripts/ci/revoke-stale-dev-certs.mjs

      - name: Archive
        working-directory: src/frontend
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet

      - name: Export and upload to App Store Connect
        working-directory: src/frontend
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded TestFlight build ${BUILD_NUMBER}." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
