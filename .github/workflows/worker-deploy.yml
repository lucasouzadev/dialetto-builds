name: Worker deploy

# Manual: Actions -> "Worker deploy" -> Run workflow.
#
# Tests and deploys the Fly.io audio worker (dialetto-worker) from the private
# source repo, then scales it to one machine and checks /health. Fly app secrets
# (Supabase URL, service role, webhook secret, ...) stay on the Fly app: this
# only ships the image. A merge in the private repo does NOT deploy until you
# run this.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of lucasouzadev/dialetto
        type: string
        default: main
      skip_tests:
        description: Skip npm test (emergency only)
        type: boolean
        default: false
      skip_health:
        description: Skip the post-deploy /health check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SKIP_TESTS: ${{ inputs.skip_tests }}
      SKIP_HEALTH: ${{ inputs.skip_health }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the private source
        uses: ./.github/actions/checkout-source
        with:
          ssh-key: ${{ secrets.DIALETTO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}

      - name: Verify FLY_API_TOKEN
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error title=Missing secret::FLY_API_TOKEN is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/services/worker/package-lock.json

      # transcode/analyze tests shell out to ffmpeg (the same binary the
      # Dockerfile installs); ubuntu-latest does not ship it.
      - name: Install ffmpeg
        if: env.SKIP_TESTS != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install and test
        if: env.SKIP_TESTS != 'true'
        working-directory: src/services/worker
        run: |
          npm ci
          npm test

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy
        working-directory: src/services/worker
        run: flyctl deploy --remote-only --config fly.toml

      # Reconciles the machine count to 1 on every deploy so it can never
      # silently drift back up (the worker's concurrency was only verified
      # safe against a single machine). Idempotent.
      - name: Scale to a single machine
        working-directory: src/services/worker
        run: flyctl scale count 1 --yes

      - name: Health check
        if: env.SKIP_HEALTH != 'true'
        working-directory: src
        run: bash services/worker/scripts/ci-health.sh
