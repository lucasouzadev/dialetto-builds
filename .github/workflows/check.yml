name: Check

# Keeps this repository's own automation honest: lints the workflows and
# validates the E2E flows. Runs on every push and pull request that touches
# them. It uses NO secrets, so it is safe to run for pull requests from forks.

on:
  push:
    paths:
      - ".github/**"
      - "e2e/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/**"
      - "e2e/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint the workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned release, verified against its checksum before it is run.
      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: Shell and Python syntax
        run: |
          for f in e2e/*.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck e2e/*.sh scripts/*.sh
          python3 -m py_compile e2e/summarize.py scripts/ota_verify.py

      # The deploy-key secret arrives damaged more often than it should
      # (CRLF, a lost final newline). This proves every repairable case is
      # repaired and every wrong one is explained, with a throwaway key.
      - name: Test the private-source checkout script
        run: bash scripts/test-checkout-private-source.sh

  flows:
    name: Validate the Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/install-maestro

      - name: maestro check-syntax
        run: |
          set -e
          for f in e2e/flows/*.yaml e2e/lib/*.yaml; do
            echo "== $f"
            maestro check-syntax "$f"
          done
